name: Beta release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Draft prerelease tag"
        required: true
        default: "v0.1.0-beta.4"
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: beta-release-candidate
  cancel-in-progress: false

env:
  APP_VERSION: "0.1.0-beta.4"
  GO_VERSION: "1.25.12"
  WAILS_VERSION: "v2.13.0"
  NODE_VERSION: "22"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release authority
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$REQUESTED_TAG" = "v$APP_VERSION"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse "refs/tags/$REQUESTED_TAG^{commit}")" = "$GITHUB_SHA"
          grep -Eq "appVersion[[:space:]]*= \"$APP_VERSION\"" buildinfo.go
          engine_version=$(awk '$1 == "github.com/tejasa97/ytdlp-go" {print $2}' go.mod)
          test -n "$engine_version"
          grep -Fq "pinnedEngineVersion = \"$engine_version\"" buildinfo.go

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          npm run check
          npm run test:ui
          npm run build
          cd ..
          go mod tidy -diff
          go vet ./...
          go test -count=1 ./...
          go test -race -count=1 ./...
          go build ./...

      - name: Build macOS Apple Silicon app
        shell: bash
        run: |
          set -euo pipefail
          wails build -clean -platform darwin/arm64
          app="build/bin/VidStow.app"
          test -d "$app"
          main_executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          test -x "$app/Contents/MacOS/$main_executable"
          test -x "$app/Contents/MacOS/ytdlp-js-helper"
          test "$(lipo -archs "$app/Contents/MacOS/$main_executable")" = "arm64"
          test "$(lipo -archs "$app/Contents/MacOS/ytdlp-js-helper")" = "arm64"
          "$app/Contents/MacOS/ytdlp-js-helper" --version
          codesign --verify --deep --strict --verbose=2 "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :VidStowReleaseVersion' "$app/Contents/Info.plist")" = "$APP_VERSION"

      - name: Package candidate and metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          ./scripts/package-release-archives.sh \
            "$APP_VERSION" darwin arm64 build/bin/VidStow.app
          archive="dist/VidStow-${APP_VERSION}-darwin-arm64.zip"
          test -f "$archive"
          verify_dir=$(mktemp -d)
          trap 'rm -rf "$verify_dir"' EXIT
          ditto -x -k "$archive" "$verify_dir"
          archived_app="$verify_dir/VidStow/VidStow.app"
          test -d "$archived_app"
          archived_executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$archived_app/Contents/Info.plist")
          test "$(lipo -archs "$archived_app/Contents/MacOS/$archived_executable")" = "arm64"
          test "$(lipo -archs "$archived_app/Contents/MacOS/ytdlp-js-helper")" = "arm64"
          codesign --verify --deep --strict --verbose=2 "$archived_app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :VidStowReleaseVersion' "$archived_app/Contents/Info.plist")" = "$APP_VERSION"
          engine_version=$(go list -m -f '{{.Version}}' github.com/tejasa97/ytdlp-go)
          {
            echo "VidStow version: $APP_VERSION"
            echo "VidStow commit: $GITHUB_SHA"
            echo "ytdlp-go module: $engine_version"
            echo "Go: $(go version)"
            echo "Node: $(node --version)"
            echo "Wails: $WAILS_VERSION"
            echo "Runner: $RUNNER_OS/$RUNNER_ARCH"
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Bundle signature: ad-hoc"
          } > dist/RELEASE-METADATA.txt
          (
            cd dist
            rm -f SHA256SUMS
            shasum -a 256 VidStow-* RELEASE-METADATA.txt > SHA256SUMS
          )
          (cd dist && shasum -a 256 -c SHA256SUMS)

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidstow-darwin-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Attest candidate provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/VidStow-${{ env.APP_VERSION }}-darwin-arm64.zip

  draft:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v4

      - name: Download candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: vidstow-darwin-arm64
          path: dist

      - name: Verify downloaded candidate
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS

      - name: Create or update draft prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          ./scripts/create-github-release.sh "$VERSION" dist "$GITHUB_SHA"
